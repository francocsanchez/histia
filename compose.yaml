services:
  histia-app:
    container_name: histia-app
    image: ghcr.io/francocsanchez/histia:latest
    env_file:
      - .env.production
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - histia_network

networks:
  histia_network:
    external: true
